name: Validate PR

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - master

# Cancel superseded runs on the same PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only workflow
permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install workspace deps
        run: deno ci

      - name: Typecheck
        run: deno check

  lint:
    name: Lint workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install workspace deps
        run: deno ci

      - name: Lint
        run: deno lint --permit-no-files

  build:
    name: Build Fresh app
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install fresh deps
        run: deno ci

      - name: Build step
        run: deno task build --debug -l warn
